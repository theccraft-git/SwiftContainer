name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      ipa_name: SwiftContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.ipa_name }}.ipa
      artifact2: ${{ env.ipa_name }}+SwiftStore.ipa
      artifact_2appid: ${{ env.ipa_name }}+SwiftStore-2AppID.ipa
      artifact_1appid: ${{ env.ipa_name }}+SwiftStore-1AppID.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Fetch OpenSSL and litehook
        run: |
          set -euo pipefail
          fetch_commit() {
            local path="$1"
            local url="$2"
            local sha="$3"
            rm -rf "$path"
            mkdir -p "$path"
            git -C "$path" init
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch --depth 1 origin "$sha"
            git -C "$path" checkout --force FETCH_HEAD
          }
          if [ ! -f OpenSSL/Frameworks/OpenSSL.xcframework/Info.plist ]; then
            fetch_commit OpenSSL https://github.com/krzyzanowskim/OpenSSL.git 623c84da314e85363236507ca38a4bde65df21c3
          fi
          if [ ! -d litehook/src ]; then
            fetch_commit litehook https://github.com/LiveContainer/litehook.git a7e9f599d7f0b3d77008ad62bf10cb10dab6eca9
          fi
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty && exit ${PIPESTATUS[0]}
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ipa_name }}.ipa
          path: ${{ env.ipa_name }}.ipa
      
      - name: Upload SwiftContainer+SwiftStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ipa_name }}+SwiftStore.ipa
          path: ${{ env.ipa_name }}+SwiftStore.ipa

      - name: Upload SwiftContainer+SwiftStore-2AppID
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ipa_name }}+SwiftStore-2AppID.ipa
          path: ${{ env.ipa_name }}+SwiftStore-2AppID.ipa

      - name: Upload SwiftContainer+SwiftStore-1AppID
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ipa_name }}+SwiftStore-1AppID.ipa
          path: ${{ env.ipa_name }}+SwiftStore-1AppID.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Download a Build Artifact 2AppID
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_2appid }}
      - name: Download a Build Artifact 1AppID
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_1appid }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
            ${{ needs.build.outputs.artifact_2appid }}
            ${{ needs.build.outputs.artifact_1appid }}
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
